<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>laptap — Daily Ski Mountain Game</title>
    <meta name="description" content="A daily geography game. Five US ski mountains, one map, tap where you think they are." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⛷️</text></svg>" />
  </head>
  <body>
    <div id="map" aria-label="Map of the United States"></div>

    <header class="topbar">
      <button id="basemap-toggle" class="chip" type="button" title="Switch basemap">RELIEF</button>
      <h1 id="title" class="topbar-title">laptap</h1>
      <button id="fit-usa" class="chip" type="button" title="Zoom out to the whole country">FIT USA</button>
    </header>

    <div id="scorebox" class="scorebox">
      <span class="scorebox-label">SCORE</span>
      <span id="score-value" class="scorebox-value">000</span>
    </div>

    <main id="stage" class="stage">
      <!-- Replaced as soon as the map style is ready; keeps the first paint from being an empty screen. -->
      <section class="card panel">
        <div class="card-kicker">LAPTAP</div>
        <h2 class="card-title">Loading terrain…</h2>
      </section>
    </main>

    <noscript class="panel">laptap needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
